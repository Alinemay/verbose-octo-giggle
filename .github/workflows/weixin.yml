name: weixin

on:
  # 支持在 Actions 页面手动点一次运行，方便先调试
  workflow_dispatch:
  schedule:
    # cron 使用国际标准时间(UTC)，北京时间 = UTC + 8
    # 下面是 UTC 23:00，即北京时间次日 07:00
    - cron: '00 23 * * *'
    # 如果你的本意是"北京时间中午12点运行"，请删掉上面一行，改用下面这行
    # - cron: '00 03 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          # 必须加引号：不加引号时 YAML 会把 3.9 当作浮点数处理
          python-version: '3.9'
          cache: 'pip'

      - name: Set timezone
        run: |
          sudo ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          date

      - name: Install pip packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run weixin
        run: |
          python main.py
